<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Đóng dấu ảnh</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <div class="top"><div class="brand">Đóng dấu ảnh</div><div class="badge">Xử lý trên máy</div></div>
  <section class="card"><h2 class="section-title">1. Chọn ảnh sản phẩm</h2><label class="upload"><input id="picker" type="file" accept="image/*" multiple><strong>＋ Chọn một hoặc nhiều ảnh</strong><span>Ảnh không được tải lên mạng</span></label><div id="files" class="files"></div><div id="fileInfo" class="status">Chưa có ảnh nào được chọn</div></section>
  <section class="card"><h2 class="section-title">2. Nội dung dấu</h2><label for="customer">Tên khách hàng</label><input id="customer" class="text" placeholder="Ví dụ: Nguyễn Văn A" autocomplete="off"><div class="grid"><div><label>Vị trí</label><div class="chips" id="positions"><button class="chip active" data-pos="left">Trái</button><button class="chip" data-pos="center">Giữa</button><button class="chip" data-pos="right">Phải</button><button class="chip" data-pos="top-right">Góc phải trên</button></div></div><div><label>Kích thước chữ</label><div class="range-row"><input id="fontSize" type="range" min="12" max="180" value="48"><span id="sizeValue" class="size-value">48 px</span></div><label style="margin-top:16px">Màu chữ</label><div class="color-row"><button class="swatch active" data-color="#ffffff" style="background:#fff"></button><button class="swatch" data-color="#111827" style="background:#111827"></button><button class="swatch" data-color="#ef4444" style="background:#ef4444"></button><button class="swatch" data-color="#facc15" style="background:#facc15"></button><button class="swatch" data-color="#2563eb" style="background:#2563eb"></button><input id="customColor" class="custom-color" type="color" value="#ffffff" title="Màu tùy chỉnh"></div></div></div></section>
  <section class="card"><h2 class="section-title">3. Xem trước</h2><div id="preview" class="preview-wrap"><div class="empty">Chọn ảnh để xem trước dấu</div><canvas id="canvas" hidden></canvas></div><div id="dimensions" class="hint"></div></section>
  <section class="card"><div class="actions"><button id="downloadOne" class="btn secondary" disabled>Tải ảnh này</button><button id="downloadAll" class="btn primary" disabled>Tải tất cả ảnh</button></div><div id="status" class="status"></div></section>
  <div class="footer">Ảnh xuất giữ nguyên độ phân giải gốc · JPEG chất lượng tối đa · PNG không mất dữ liệu</div>
</main>
<script src="app.js" defer></script>
</body></html>
